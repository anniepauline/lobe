name: lobe

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: lobe
      POSTGRES_PASSWORD: lobe
      POSTGRES_USER: lobe
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lobe -d lobe"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "5434:5432"
    volumes:
      - lobe_postgres:/var/lib/postgresql/data

volumes:
  lobe_postgres:
